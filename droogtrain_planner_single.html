<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Droogtrain Planner – Jesse & Reny (Single File)</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#e2e8f0;background:#0b1220}
header{padding:20px 16px;background:linear-gradient(90deg,#0ea5e9,#22c55e);color:white}
h1{margin:0;font-size:28px}
.subtitle{margin:4px 0 0;opacity:.9}
main{padding:16px;max-width:960px;margin:0 auto}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.row{display:flex;gap:8px;align-items:center;background:#0f172a;border:1px solid #1f2937;padding:10px;border-radius:10px;color:#e2e8f0}
label{min-width:72px;color:#cbd5e1}
select{flex:1;padding:8px;border-radius:8px;border:1px solid #334155;background:#0b1220;color:#e2e8f0}
.cards{display:grid;grid-template-columns:1fr;gap:14px}
.card{background:#0f172a;border:1px solid #1f2937;border-radius:14px;padding:14px;color:#e2e8f0}
.card h2{margin:0 0 10px;color:#e2e8f0}
.meal{padding:10px;border:1px dashed #334155;border-radius:10px;margin-bottom:10px}
.meal h3{margin:0 0 6px;font-size:16px;color:#93c5fd}
ul{margin:6px 0 0 18px;color:#e2e8f0}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;background:#1e293b;color:#93c5fd;margin-right:6px;font-size:12px}
footer{padding:18px 12px;text-align:center;color:#94a3b8;border-top:1px solid #1f2937;margin-top:20px}
button{padding:10px 14px;border-radius:10px;border:1px solid #334155;background:#0ea5e9;color:white;font-weight:600;cursor:pointer}
button:hover{filter:brightness(1.05)}
.table{width:100%;border-collapse:collapse;margin-top:10px;color:#e2e8f0}
.table th,.table td{border:1px solid #334155;padding:8px;border-left:none;border-right:none}
.table th{color:#93c5fd;text-align:left}
.kcal{color:#fde68a}
.tag{font-size:12px;color:#a7f3d0}
@media(min-width:800px){.cards{grid-template-columns:1fr 1fr}.card:nth-child(3){grid-column:1/-1}}
</style>
</head>
<body>
<header>
  <h1>Droogtrain Planner</h1>
  <p class="subtitle">8-week schema – voeding, training & boodschappen</p>
</header>

<main>
  <section class="controls">
    <div class="row">
      <label for="person">Persoon</label>
      <select id="person">
        <option value="jesse">Jesse (25, 178 cm, 89.5 kg)</option>
        <option value="reny">Reny (48, 167 cm, 110 kg)</option>
      </select>
    </div>
    <div class="row">
      <label for="week">Week</label>
      <select id="week"></select>
    </div>
    <div class="row">
      <label for="day">Dag</label>
      <select id="day"></select>
    </div>
  </section>

  <section class="cards">
    <article class="card">
      <h2>Training</h2>
      <div id="training"></div>
    </article>

    <article class="card">
      <h2>Voeding (met porties)</h2>
      <div id="meals"></div>
    </article>

    <article class="card">
      <h2>Boodschappen (per week)</h2>
      <div class="row">
        <label><input type="checkbox" id="includeJesse" checked> Jesse</label>
        <label><input type="checkbox" id="includeReny" checked> Reny</label>
      </div>
      <button id="btnList">Genereer boodschappenlijst voor deze week</button>
      <div id="groceries"></div>
    </article>
  </section>
</main>

<footer>
  <p>Gemaakt voor Jesse de Vries & Reny Kraaijenbrink • Werkt lokaal en op GitHub Pages</p>
</footer>

<script>
// --- DATA ---
const PERSONS = {
  jesse: { name:"Jesse", kcal:2300, protein:200, carb:200, fat:60, multipliers:{protein:1,carb:1,fat:1,fruit:1,dairy:1,bread:1}},
  reny:  { name:"Reny",  kcal:1700, protein:150, carb:150, fat:55, multipliers:{protein:0.8,carb:0.75,fat:0.9,fruit:0.75,dairy:0.8,bread:0.75}}
};
function I(name, qty, unit, cat){ return {name, qty, unit, cat}; }
const WEEK1=[
 {training:"Zwemmen 07:00 – vetverbranding & conditie", meals:[
   {t:"06:30 Pre-zwemmen", items:[I("Banaan",1,"st","fruit"), I("Koffie/water",1,"portie","misc")]},
   {t:"08:00 Ontbijt", items:[I("Havermout",60,"g","carb"), I("Eiwitpoeder",30,"g","protein"), I("Blauwe bessen",50,"g","fruit"), I("Pindakaas",10,"g","fat")]},
   {t:"12:30 Lunch", items:[I("Kipfilet",150,"g","protein"), I("Rijst (droog)",100,"g","carb"), I("Broccoli",150,"g","veg"), I("Olijfolie",5,"g","fat")]},
   {t:"16:00 Snack", items:[I("Magere kwark",250,"g","dairy"), I("Walnoten",20,"g","fat")]},
   {t:"19:00 Diner", items:[I("Zalmfilet",150,"g","protein"), I("Zoete aardappel",150,"g","carb"), I("Sperziebonen",150,"g","veg")]},
   {t:"22:00 Snack", items:[I("Caseïne (poeder)",30,"g","protein"), I("Appel",1,"st","fruit")]},
 ]},
 {training:"Kracht – Push 18:30 (borst/schouders/triceps)", meals:[
   {t:"08:00 Ontbijt", items:[I("Volkoren brood",2,"sn","bread"), I("Eieren",3,"st","protein"), I("Rauwkost",1,"portie","veg")]},
   {t:"12:30 Lunch", items:[I("Kalkoenfilet",150,"g","protein"), I("Volkoren pasta (droog)",100,"g","carb"), I("Spinazie",100,"g","veg"), I("Olijfolie",10,"g","fat")]},
   {t:"16:30 Pre-workout", items:[I("Eiwitshake",30,"g","protein"), I("Banaan",1,"st","fruit")]},
   {t:"19:30 Diner", items:[I("Rundergehakt mager",150,"g","protein"), I("Rijst (droog)",120,"g","carb"), I("Groentenmix",150,"g","veg")]},
   {t:"22:00 Snack", items:[I("Magere kwark",200,"g","dairy"), I("Honing",10,"g","carb")]},
 ]},
 {training:"Zwemmen 07:00 – core & actief herstel", meals:[
   {t:"06:30 Pre-zwemmen", items:[I("Banaan",0.5,"st","fruit"), I("Koffie/water",1,"portie","misc")]},
   {t:"08:00 Ontbijt", items:[I("Havermout",50,"g","carb"), I("Eiwitpoeder",30,"g","protein"), I("Pindakaas",10,"g","fat")]},
   {t:"12:30 Lunch", items:[I("Tonijn (blik, uitgelekt)",150,"g","protein"), I("Volkoren wrap",2,"st","carb"), I("Salade (sla/tomaat/komkommer)",1,"portie","veg")]},
   {t:"16:00 Snack", items:[I("Eiwitreep",1,"st","protein")]},
   {t:"19:00 Diner", items:[I("Kipfilet",150,"g","protein"), I("Couscous (droog)",100,"g","carb"), I("Groentenmix",150,"g","veg")]},
   {t:"22:00 Snack", items:[I("Magere kwark",200,"g","dairy"), I("Kaneel",1,"snuf","misc")]},
 ]},
 {training:"Kracht – Pull 18:30 (rug/biceps)", meals:[
   {t:"08:00 Ontbijt", items:[I("Griekse yoghurt 0%",250,"g","dairy"), I("Havermout",40,"g","carb"), I("Blauwe bessen",50,"g","fruit"), I("Amandelen",10,"g","fat")]},
   {t:"12:30 Lunch", items:[I("Kipfilet",150,"g","protein"), I("Rijst (droog)",120,"g","carb"), I("Spinazie",100,"g","veg")]},
   {t:"16:30 Pre-workout", items:[I("Banaan",1,"st","fruit"), I("Eiwitshake",30,"g","protein")]},
   {t:"19:30 Diner", items:[I("Zalmfilet",150,"g","protein"), I("Volkoren pasta (droog)",100,"g","carb"), I("Broccoli",150,"g","veg")]},
   {t:"22:00 Snack", items:[I("Magere kwark",200,"g","dairy"), I("Noten",15,"g","fat")]},
 ]},
 {training:"Rust – wandeling/stretch (optioneel)", meals:[
   {t:"08:00 Ontbijt", items:[I("Volkoren brood",2,"sn","bread"), I("Eieren",2,"st","protein"), I("Appel",1,"st","fruit")]},
   {t:"12:30 Lunch", items:[I("Tonijnsalade + 1 wrap",1,"portie","protein")]},
   {t:"16:00 Snack", items:[I("Eiwitreep",1,"st","protein")]},
   {t:"19:00 Diner", items:[I("Kipfilet",150,"g","protein"), I("Aardappelen (gekookt)",150,"g","carb"), I("Groenten",150,"g","veg")]},
   {t:"22:00 Snack", items:[I("Magere kwark",200,"g","dairy"), I("Kaneel",1,"snuf","misc")]},
 ]},
 {training:"Kracht – Benen + Core 08:00", meals:[
   {t:"07:00 Pre-workout", items:[I("Banaan",1,"st","fruit"), I("Eiwitshake",30,"g","protein")]},
   {t:"09:30 Ontbijt", items:[I("Havermout",70,"g","carb"), I("Eiwitpoeder",30,"g","protein"), I("Pindakaas",10,"g","fat"), I("Banaan",1,"st","fruit")]},
   {t:"12:30 Lunch", items:[I("Kalkoenfilet",150,"g","protein"), I("Rijst (droog)",100,"g","carb"), I("Groenten",150,"g","veg")]},
   {t:"16:30 Snack", items:[I("Magere kwark",200,"g","dairy"), I("Noten",20,"g","fat")]},
   {t:"19:30 Diner", items:[I("Zalmfilet",150,"g","protein"), I("Zoete aardappel",150,"g","carb"), I("Broccoli",150,"g","veg")]},
   {t:"22:00 Snack", items:[I("Caseïne (poeder)",30,"g","protein")]},
 ]},
 {training:"Rust – herstel & voeding focus", meals:[
   {t:"08:30 Ontbijt", items:[I("Volkoren brood",2,"sn","bread"), I("Eieren",3,"st","protein"), I("Rauwkost",1,"portie","veg")]},
   {t:"12:30 Lunch", items:[I("Kipfilet",150,"g","protein"), I("Couscous (droog)",100,"g","carb"), I("Groenten",150,"g","veg")]},
   {t:"16:00 Snack", items:[I("Magere kwark",200,"g","dairy"), I("Honing",15,"g","carb")]},
   {t:"19:00 Diner", items:[I("Rundergehakt mager",150,"g","protein"), I("Zoete aardappel",150,"g","carb"), I("Spinazie",100,"g","veg")]},
   {t:"22:00 Snack", items:[I("Magere kwark",200,"g","dairy"), I("Kaneel",1,"snuf","misc")]},
 ]},
];
function makeWeekFrom(base, swaps){return base.map((day,i)=>{const d=JSON.parse(JSON.stringify(day));(swaps[i]||[]).forEach(([a,b])=>{d.meals.forEach(m=>m.items.forEach(it=>{if(it.name===a) it.name=b;}))});return d;});}
const WEEK2 = makeWeekFrom(WEEK1,[[],[],[["Tonijn (blik, uitgelekt)","Kipfilet"]],[["Zalmfilet","Kabeljauw"]],[["Kipfilet","Kippendijen (mager, zonder vel)"]],[["Zalmfilet","Witvis (tilapia/koolvis)"]],[["Rundergehakt mager","Kalkoenfilet"]],]);
const WEEK3 = makeWeekFrom(WEEK1,[[["Zalmfilet","Zalmfilet"]],[["Kalkoenfilet","Kipfilet"]],[["Volkoren wrap","Volkoren brood"]],[["Zalmfilet","Zalmfilet"]],[["Tonijnsalade + 1 wrap","Kipfilet + 1 wrap"]],[["Kalkoenfilet","Kipfilet"]],[["Couscous (droog)","Bulgur (droog)"]],]);
const WEEK4 = makeWeekFrom(WEEK1,[[["Sperziebonen","Asperges (groen)"]],[["Volkoren pasta (droog)","Volkoren pasta (droog)"]],[["Couscous (droog)","Volkoren couscous (droog)"]],[["Zalmfilet","Kabeljauw"]],[],[["Rijst (droog)","Quinoa (droog)"]],[["Zoete aardappel","Aardappel (gekookt)"]],]);
const WEEK5 = makeWeekFrom(WEEK1,[[["Zalmfilet","Witvis (koolvis)"]],[["Rundergehakt mager","Runderbiefstuk (mager)"]],[["Havermout","Havermout"]],[["Zalmfilet","Zalmfilet"]],[],[["Zalmfilet","Zalmfilet"]],[["Spinazie","Rucola"]],]);
const WEEK6 = makeWeekFrom(WEEK1,[[["Zalmfilet","Witvis (tilapia)"]],[["Kalkoenfilet","Kalkoenfilet"]],[["Tonijn (blik, uitgelekt)","Tonijn (blik, uitgelekt)"]],[["Zalmfilet","Zalmfilet"]],[],[["Kalkoenfilet","Kipfilet"]],[["Zoete aardappel","Bloemkoolrijst (gekookt)"]],]);
const WEEK7 = makeWeekFrom(WEEK1,[[["Zoete aardappel","Zoete aardappel"]],[["Volkoren pasta (droog)","Volkoren pasta (droog)"]],[["Couscous (droog)","Couscous (droog)"]],[["Zalmfilet","Zalmfilet"]],[],[["Zoete aardappel","Zoete aardappel"]],[["Rundergehakt mager","Rundergehakt mager"]],]);
const WEEK8 = makeWeekFrom(WEEK1,[[],[],[],[],[],[],[]]);
const ALL_WEEKS=[WEEK1,WEEK2,WEEK3,WEEK4,WEEK5,WEEK6,WEEK7,WEEK8];
const TRAINING = {
  week1: ["Ma: Zwem 07:00","Di: Push 18:30","Wo: Zwem 07:00","Do: Pull 18:30","Vr: Rust","Za: Benen+Core 08:00","Zo: Rust"],
  week2: ["Ma: Zwem 07:00","Di: Push 18:30","Wo: Zwem 07:00","Do: Pull 18:30","Vr: Rust","Za: Benen+Core 08:00","Zo: Rust"],
  week3: ["Ma: Zwem 07:00","Di: Push 18:30","Wo: Zwem 07:00","Do: Pull 18:30","Vr: Rust","Za: Benen+Core 08:00","Zo: Rust"],
  week4: ["Ma: Zwem 07:00","Di: Push 18:30","Wo: Zwem 07:00","Do: Pull 18:30","Vr: Rust","Za: Benen+Core 08:00","Zo: Rust"],
  week5: ["Ma: Zwem 07:00","Di: Push 18:30","Wo: Zwem 07:00","Do: Pull 18:30","Vr: Rust","Za: Benen+Core 08:00","Zo: Rust"],
  week6: ["Ma: Zwem 07:00","Di: Push 18:30","Wo: Zwem 07:00","Do: Pull 18:30","Vr: Rust","Za: Benen+Core 08:00","Zo: Rust"],
  week7: ["Ma: Zwem 07:00","Di: Push 18:30","Wo: Zwem 07:00","Do: Pull 18:30","Vr: Rust","Za: Benen+Core 08:00","Zo: Rust"],
  week8: ["Ma: Zwem 07:00","Di: Push 18:30","Wo: Zwem 07:00","Do: Pull 18:30","Vr: Rust","Za: Benen+Core 08:00","Zo: Rust"],
};

// --- UI ---
const weekSel=document.getElementById('week');
const daySel=document.getElementById('day');
const personSel=document.getElementById('person');
const mealsDiv=document.getElementById('meals');
const trainDiv=document.getElementById('training');
const groceriesDiv=document.getElementById('groceries');
const btnList=document.getElementById('btnList');
const cbJesse=document.getElementById('includeJesse');
const cbReny=document.getElementById('includeReny');

for(let w=1; w<=8; w++){ const o=document.createElement('option'); o.value=w-1; o.textContent="Week "+w; weekSel.appendChild(o); }
["Dag 1 (ma)","Dag 2 (di)","Dag 3 (wo)","Dag 4 (do)","Dag 5 (vr)","Dag 6 (za)","Dag 7 (zo)"].forEach((lab,i)=>{const o=document.createElement('option');o.value=i;o.textContent=lab;daySel.appendChild(o);});

function formatQty(q){ if(typeof q==="number"){ if(Math.abs(q-Math.round(q))<1e-6) return String(q); if(Math.abs(q*2-Math.round(q*2))<1e-6) return (Math.round(q*2)+"/2"); return q.toFixed(1);} return q; }
function applyMultipliers(item, who){ const m=PERSONS[who].multipliers; let f=1; const map={protein:"protein",carb:"carb",fat:"fat",fruit:"fruit",dairy:"dairy",bread:"bread"}; f=m[map[item.cat]] ?? 1; const s={...item}; if(typeof s.qty==="number") s.qty=Math.round(s.qty*f*10)/10; return s; }

function render(){
  groceriesDiv.innerHTML="";
  const wk=Number(weekSel.value), dy=Number(daySel.value), who=personSel.value;
  const day=ALL_WEEKS[wk][dy];
  const tLines = TRAINING["week"+(wk+1)].map(x=>`<span class="badge">${x}</span>`).join(" ");
  trainDiv.innerHTML = `<div>${tLines}</div><p class="tag">${day.training}</p>`;
  mealsDiv.innerHTML="";
  day.meals.forEach(m=>{
    const list = m.items.map(it=>applyMultipliers(it,who)).map(it=>`<li>${it.name}: <strong>${formatQty(it.qty)}</strong> ${it.unit}</li>`).join("");
    mealsDiv.insertAdjacentHTML("beforeend", `<div class="meal"><h3>${m.t}</h3><ul>${list}</ul></div>`);
  });
}

function generateGroceries(){
  const wk=Number(weekSel.value); const incJ=cbJesse.checked, incR=cbReny.checked;
  if(!incJ && !incR){groceriesDiv.innerHTML="<p>Kies minstens één persoon.</p>"; return;}
  const agg=new Map();
  function add(it,who){ const a=applyMultipliers(it,who); const key=a.name+"|"+a.unit; const cur=agg.get(key)||{name:a.name,unit:a.unit,qty:0}; cur.qty += (typeof a.qty==="number" ? a.qty : (a.qty==="st"?1:0)); agg.set(key,cur); }
  ALL_WEEKS[wk].forEach(d=>d.meals.forEach(m=>m.items.forEach(it=>{ if(incJ) add(it,"jesse"); if(incR) add(it,"reny"); })));
  const rows=[...agg.values()].sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<tr><td>${x.name}</td><td><strong>${formatQty(Math.round(x.qty*10)/10)}</strong> ${x.unit}</td></tr>`).join("");
  groceriesDiv.innerHTML = `<table class="table"><thead><tr><th>Product</th><th>Hoeveelheid week</th></tr></thead><tbody>${rows}</tbody></table><p class="tag">Tip: rond gewichten af in de winkel (pak groter als het goedkoper is). Eiwit-/caseïnepoeder en repen meestal via Jumbo/online.</p>`;
}

weekSel.addEventListener('change',render);
daySel.addEventListener('change',render);
personSel.addEventListener('change',render);
btnList.addEventListener('click',generateGroceries);
cbJesse.addEventListener('change',()=>{ if(!cbJesse.checked && !cbReny.checked) cbReny.checked=true; });
cbReny.addEventListener('change',()=>{ if(!cbJesse.checked && !cbReny.checked) cbJesse.checked=true; });

weekSel.value=0; daySel.value=0; personSel.value="jesse"; render();
</script>
</body>
</html>
